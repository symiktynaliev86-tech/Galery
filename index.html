<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Фотогалерея</h1>

        <div class="gallery">
            <img src="https://picsum.photos/id/1015/600/400" alt="">
            <img src="https://picsum.photos/id/1016/600/400" alt="">
            <img src="https://picsum.photos/id/1025/600/400" alt="">
            <img src="https://picsum.photos/id/1035/600/400" alt="">
            <img src="https://picsum.photos/id/1043/600/400" alt="">
            <img src="https://picsum.photos/id/1050/600/400" alt="">
        </div>
    </div>

    <div class="modal">
        <span class="close">&times;</span>

        <button class="nav prev">&#10094;</button>

        <img class="modal-img" src="" alt="">

        <button class="nav next">&#10095;</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
